spring.application.name=auth-service
server.port=8087

spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/rx_auth_db}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

eureka.client.service-url.defaultZone=${EUREKA_SERVER_URL:http://localhost:8761/eureka/}

management.endpoints.web.exposure.include=health,info

# JWT Configuration (provide a Base64-encoded secret via JWT_SECRET)
jwt.secret=${JWT_SECRET:UmVjb3ZlclgtRGVtby1TZWNyZXQtS2V5LUZvci1IUzI1Ng==}
jwt.expiration=${JWT_EXPIRATION:86400000}

# SMTP Configuration (reuse the same environment variables as Customer Service)
spring.mail.host=${SMTP_HOST:smtp.gmail.com}
spring.mail.port=${SMTP_PORT:587}
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true

# Frontend reset-password page
app.frontend.reset-password-url=${FRONTEND_RESET_PASSWORD_URL:http://localhost:5173/reset-password}

# Password reset token validity: 15 minutes
app.password-reset.token-validity-minutes=15
