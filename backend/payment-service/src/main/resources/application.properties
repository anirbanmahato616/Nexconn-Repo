spring.application.name=payment-service
server.port=8083

spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/rx_payment_db}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

eureka.client.service-url.defaultZone=${EUREKA_SERVER_URL:http://localhost:8761/eureka/}
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true

# Must match the signing secret used by Auth Service and Business Service.
# Replace the development fallback with a secure secret in production.
jwt.secret=${JWT_SECRET:UmVjb3ZlclgtRGVtby1TZWNyZXQtS2V5LUZvci1IUzI1Ng==}

services.business.base-url=${BUSINESS_SERVICE_URL:http://localhost:8088}
services.customer.base-url=${CUSTOMER_SERVICE_URL:http://localhost:8081}
services.invoice.base-url=${INVOICE_SERVICE_URL:http://localhost:8082}

management.endpoints.web.exposure.include=health,info

# Must match Invoice Service internal.payment-service.secret.
internal.payment-service.secret=${PAYMENT_SERVICE_INTERNAL_SECRET:RecoverX-Local-Payment-Internal-Secret-Change-Before-Deployment}
