# Application
spring.application.name=ai-service
server.port=${SERVER_PORT:8086}

# Eureka
eureka.client.service-url.defaultZone=${EUREKA_URL:http://localhost:8761/eureka/}
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true

# Spring AI - Google Gemini
spring.ai.google.genai.api-key=AIzaSyA1ONYSrambDE8-gV7RGp0clorOeotr2mk
spring.ai.google.genai.chat.model=${GEMINI_MODEL:gemini-2.5-flash}
spring.ai.google.genai.chat.temperature=0.2

# JWT: must be the same Base64-encoded secret used by Auth and other services
jwt.secret=${JWT_SECRET:UmVjb3ZlclgtRGVtby1TZWNyZXQtS2V5LUZvci1IUzI1Ng==}

# Business Service membership validation
business.service.url=${BUSINESS_SERVICE_URL:http://localhost:8088}

# Actuator
management.endpoints.web.exposure.include=health,info

# Internal server-to-server authentication (must match Conversation Service)
recoverx.internal-api-key=${RECOVERX_INTERNAL_API_KEY:}
