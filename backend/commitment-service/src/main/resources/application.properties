spring.application.name=commitment-service
server.port=8084

spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/rx_commitment_db}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

eureka.client.service-url.defaultZone=${EUREKA_SERVER_URL:http://localhost:8761/eureka/}
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true

management.endpoints.web.exposure.include=health,info

# Must match the signing secret configured in Auth Service and Business Service.
jwt.secret=${JWT_SECRET:UmVjb3ZlclgtRGVtby1TZWNyZXQtS2V5LUZvci1IUzI1Ng==}

services.business.base-url=${BUSINESS_SERVICE_URL:http://localhost:8088}
services.invoice.base-url=${INVOICE_SERVICE_URL:http://localhost:8082}

# Shared secret for trusted Conversation Service -> Commitment Service calls
recoverx.internal-api-key=${RECOVERX_INTERNAL_API_KEY:}
