spring.application.name=invoice-service

server.port=8082

# MySQL Configuration
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/rx_invoice_db}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

# JPA Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Eureka Configuration
eureka.client.service-url.defaultZone=${EUREKA_SERVER_URL:http://localhost:8761/eureka/}
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true

# Actuator
management.endpoints.web.exposure.include=health,info
# JWT secret must be identical to Auth Service and Business Service.
# Fallback is for local development only.
jwt.secret=${JWT_SECRET:UmVjb3ZlclgtRGVtby1TZWNyZXQtS2V5LUZvci1IUzI1Ng==}

# Invoice Service calls Business Service to verify active membership.
business.service.url=${BUSINESS_SERVICE_URL:http://localhost:8088}

# Shared secret used only for direct Payment Service -> Invoice Service calls.
internal.payment-service.secret=${PAYMENT_SERVICE_INTERNAL_SECRET:RecoverX-Local-Payment-Internal-Secret-Change-Before-Deployment}
