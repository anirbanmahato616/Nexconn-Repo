spring.application.name=business-service
server.port=8088

spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/rx_business_db}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

eureka.client.service-url.defaultZone=http://localhost:8761/eureka/

management.endpoints.web.exposure.include=health,info

# Must match the JWT signing secret configured in Auth Service.
# This fallback is for local development only. Use an environment variable in production.
jwt.secret=${JWT_SECRET:UmVjb3ZlclgtRGVtby1TZWNyZXQtS2V5LUZvci1IUzI1Ng==}

recoverx.internal-api-key=${RECOVERX_INTERNAL_API_KEY:}
