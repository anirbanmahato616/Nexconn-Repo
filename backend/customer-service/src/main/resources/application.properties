spring.application.name=customer-service
server.port=8081

# MySQL Configuration
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/rx_customer_db}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

# JPA Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Eureka Configuration
eureka.client.service-url.defaultZone=${EUREKA_SERVER_URL:http://localhost:8761/eureka/}
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true

# JWT secret MUST be identical to Auth Service and Business Service.
# The fallback is only for local development.
jwt.secret=${JWT_SECRET:UmVjb3ZlclgtRGVtby1TZWNyZXQtS2V5LUZvci1IUzI1Ng==}

# Customer Service calls Business Service directly to verify active membership.
business.service.url=${BUSINESS_SERVICE_URL:http://localhost:8088}

management.endpoints.web.exposure.include=health,info


# Customer invitation email (Gmail SMTP defaults; configure credentials as environment variables)
spring.mail.host=${SMTP_HOST:smtp.gmail.com}
spring.mail.port=${SMTP_PORT:587}
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true

# Frontend route that displays the invitation acceptance page
app.frontend.invitation-url=${FRONTEND_INVITATION_URL:http://localhost:5173/accept-invitation}

# Shared secret for authenticated internal calls from Payment Service.
internal.payment-service.secret=${PAYMENT_SERVICE_INTERNAL_SECRET:RecoverX-Local-Payment-Internal-Secret-Change-Before-Deployment}
