
# Application
spring.application.name=conversation-service
server.port=8085

# MySQL Database
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/rx_conversation_db}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Eureka
eureka.client.service-url.defaultZone=${EUREKA_SERVER_URL:http://localhost:8761/eureka/}
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true

# JWT
jwt.secret=${JWT_SECRET:UmVjb3ZlclgtRGVtby1TZWNyZXQtS2V5LUZvci1IUzI1Ng==}

# Business Service
business.service.url=${BUSINESS_SERVICE_URL:http://localhost:8088}

# Invoice Service
services.invoice.base-url=${INVOICE_SERVICE_URL:http://localhost:8082}

# Customer Service
services.customer.base-url=${CUSTOMER_SERVICE_URL:http://localhost:8081}

# Actuator
management.endpoints.web.exposure.include=health,info

# Nexconn Chat Platform API
nexconn.app-key=${NEXCONN_APP_KEY:}
nexconn.app-secret=${NEXCONN_APP_SECRET:}
nexconn.base-url=${NEXCONN_BASE_URL:https://api.sg-light-api.com}
nexconn.webhook-clock-skew-seconds=${NEXCONN_WEBHOOK_CLOCK_SKEW_SECONDS:300}

# AI Service
services.ai.url=${AI_SERVICE_URL:http://localhost:8086}

# Internal API Key (must match AI Service)
services.internal.api-key=${RECOVERX_INTERNAL_API_KEY:}

# Default Timezone
recoverx.default-timezone=${RECOVERX_DEFAULT_TIMEZONE:Asia/Kolkata}

# Commitment Service
services.commitment.base-url=${COMMITMENT_SERVICE_URL:http://localhost:8084}

# Logging
logging.level.org.springframework.security=DEBUG
logging.level.com.recoverx.gateway.security=DEBUG
