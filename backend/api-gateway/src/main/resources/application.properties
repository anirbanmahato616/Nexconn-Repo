# Application
spring.application.name=api-gateway
server.port=8080

# Eureka
eureka.client.service-url.defaultZone=${EUREKA_SERVER_URL:http://localhost:8761/eureka/}
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true

# JWT: MUST be identical to Auth Service and downstream services.
# Keep the demo value only for local development. Use an environment secret in deployment.
jwt.secret=${JWT_SECRET:UmVjb3ZlclgtRGVtby1TZWNyZXQtS2V5LUZvci1IUzI1Ng==}

# Spring Cloud Gateway Server Web MVC routes.
# More specific business-resource routes must be declared before the general Business Service route.

spring.cloud.gateway.server.webmvc.routes[0].id=auth-service
spring.cloud.gateway.server.webmvc.routes[0].uri=lb://auth-service
spring.cloud.gateway.server.webmvc.routes[0].predicates[0]=Path=/api/auth/**

spring.cloud.gateway.server.webmvc.routes[1].id=customer-service
spring.cloud.gateway.server.webmvc.routes[1].uri=lb://customer-service
spring.cloud.gateway.server.webmvc.routes[1].predicates[0]=Path=/api/businesses/*/customers/**

spring.cloud.gateway.server.webmvc.routes[2].id=invoice-service
spring.cloud.gateway.server.webmvc.routes[2].uri=lb://invoice-service
spring.cloud.gateway.server.webmvc.routes[2].predicates[0]=Path=/api/businesses/*/invoices/**

spring.cloud.gateway.server.webmvc.routes[3].id=payment-service
spring.cloud.gateway.server.webmvc.routes[3].uri=lb://payment-service
spring.cloud.gateway.server.webmvc.routes[3].predicates[0]=Path=/api/businesses/*/payments/**

spring.cloud.gateway.server.webmvc.routes[4].id=commitment-service
spring.cloud.gateway.server.webmvc.routes[4].uri=lb://commitment-service
spring.cloud.gateway.server.webmvc.routes[4].predicates[0]=Path=/api/businesses/*/commitments/**

spring.cloud.gateway.server.webmvc.routes[5].id=conversation-service
spring.cloud.gateway.server.webmvc.routes[5].uri=lb://conversation-service
spring.cloud.gateway.server.webmvc.routes[5].predicates[0]=Path=/api/businesses/*/conversations/**

spring.cloud.gateway.server.webmvc.routes[6].id=ai-service
spring.cloud.gateway.server.webmvc.routes[6].uri=lb://ai-service
spring.cloud.gateway.server.webmvc.routes[6].predicates[0]=Path=/api/ai/**

spring.cloud.gateway.server.webmvc.routes[7].id=business-service
spring.cloud.gateway.server.webmvc.routes[7].uri=lb://business-service
spring.cloud.gateway.server.webmvc.routes[7].predicates[0]=Path=/api/businesses/**

# Customer invoice routes - must come before general customer route
spring.cloud.gateway.server.webmvc.routes[8].id=customer-invoice-service
spring.cloud.gateway.server.webmvc.routes[8].uri=lb://invoice-service
spring.cloud.gateway.server.webmvc.routes[8].predicates[0]=Path=/api/customers/me/invoices,/api/customers/me/invoices/**

# Customer payment history - must come before general customer route
spring.cloud.gateway.server.webmvc.routes[9].id=customer-payment-service
spring.cloud.gateway.server.webmvc.routes[9].uri=lb://payment-service
spring.cloud.gateway.server.webmvc.routes[9].predicates[0]=Path=/api/customers/me/payments,/api/customers/me/payments/**

# Customer commitment history
spring.cloud.gateway.server.webmvc.routes[10].id=customer-commitment-service
spring.cloud.gateway.server.webmvc.routes[10].uri=lb://commitment-service
spring.cloud.gateway.server.webmvc.routes[10].predicates[0]=Path=/api/customers/me/commitments,/api/customers/me/commitments/**

# Customer conversation routes
spring.cloud.gateway.server.webmvc.routes[11].id=customer-conversation-service
spring.cloud.gateway.server.webmvc.routes[11].uri=lb://conversation-service
spring.cloud.gateway.server.webmvc.routes[11].predicates[0]=Path=/api/customers/me/conversations,/api/customers/me/conversations/**

# General customer routes
spring.cloud.gateway.server.webmvc.routes[12].id=my-customer-service
spring.cloud.gateway.server.webmvc.routes[12].uri=lb://customer-service
spring.cloud.gateway.server.webmvc.routes[12].predicates[0]=Path=/api/customers/**

# Nexconn token route
spring.cloud.gateway.server.webmvc.routes[13].id=nexconn-service
spring.cloud.gateway.server.webmvc.routes[13].uri=lb://conversation-service
spring.cloud.gateway.server.webmvc.routes[13].predicates[0]=Path=/api/nexconn/**

# CORS for local React/Vite development
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000}

# Actuator
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=never

logging.level.org.springframework.security=DEBUG
logging.level.com.recoverx.gateway.security=DEBUG

logging.level.org.springframework.cloud.loadbalancer=DEBUG
logging.level.com.netflix.discovery=DEBUG
